server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # /api goes to the API container. The client address is OVERWRITTEN (not
    # appended to) so a client cannot fake X-Forwarded-For; the API is told to
    # trust exactly this one proxy (TRUST_PROXY_HOPS=1).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location ~* \.(?:js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app: unknown paths get index.html so
    # deep links such as /team work after a reload. It must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
