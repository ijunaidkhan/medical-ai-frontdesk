# Included in every location that sets its own headers (nginx drops inherited
# add_header lines as soon as a location adds one, so they are repeated by include).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Only scripts from our own files may run: an injected script is refused.
# Styles allow 'unsafe-inline' because Angular adds component styles at run time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
